<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>OT·I — Arcade</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap');

:root {
  --bg: #0a0a0f;
  --panel: #12121a;
  --border: #2a2a3a;
  --text: #e0e0f0;
  --muted: #5a5a7a;
  --cyan: #00f5ff;
  --purple: #b44fff;
  --yellow: #ffe600;
  --green: #00ff88;
  --red: #ff3355;
  --orange: #ff8800;
  --font-pixel: 'Press Start 2P', monospace;
  --font-mono: 'Share Tech Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg); color: var(--text);
  font-family: var(--font-mono);
  min-height: 100vh; padding: 16px;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
  pointer-events: none; z-index: 9999;
}

.arcade-header { text-align: center; padding: 24px 0 20px; border-bottom: 2px solid var(--border); margin-bottom: 24px; }
.arcade-title {
  font-family: var(--font-pixel); font-size: clamp(10px,3vw,16px);
  color: var(--cyan); letter-spacing: 2px; margin-bottom: 6px;
  text-shadow: 0 0 20px var(--cyan); animation: glow-pulse 2s ease-in-out infinite;
}
.arcade-sub { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
@keyframes glow-pulse {
  0%,100% { text-shadow: 0 0 20px var(--cyan), 0 0 40px rgba(0,245,255,0.3); }
  50%      { text-shadow: 0 0 30px var(--cyan), 0 0 60px rgba(0,245,255,0.5); }
}

.selector-panel {
  background: var(--panel); border: 2px solid var(--border);
  padding: 16px; margin-bottom: 20px; max-width: 600px; margin-left: auto; margin-right: auto;
}
.selector-label { font-family: var(--font-pixel); font-size: 8px; color: var(--purple); margin-bottom: 12px; letter-spacing: 1px; }
.group-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.group-tab {
  flex: 1; padding: 8px; background: var(--bg); border: 2px solid var(--border);
  color: var(--muted); font-family: var(--font-pixel); font-size: 7px;
  cursor: pointer; text-align: center; transition: all 0.1s;
}
.group-tab.active { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px rgba(0,245,255,0.3); }
.player-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 6px; max-height: 240px; overflow-y: auto; }
.player-btn {
  padding: 8px 10px; background: var(--bg); border: 2px solid var(--border);
  color: var(--text); font-family: var(--font-mono); font-size: 12px;
  cursor: pointer; text-align: left; display: flex; justify-content: space-between; align-items: center; transition: all 0.1s; width: 100%;
}
.player-btn:hover { border-color: var(--purple); color: var(--purple); }
.player-btn.active { border-color: var(--yellow); color: var(--yellow); box-shadow: 0 0 10px rgba(255,230,0,0.2); }
.player-lvl { font-family: var(--font-pixel); font-size: 7px; }
.state-msg { text-align: center; padding: 20px; font-size: 11px; color: var(--muted); }
.spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--cyan); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 8px; }
@keyframes spin { to { transform: rotate(360deg); } }

.game-screen { display: none; max-width: 600px; margin: 0 auto; }
.game-screen.visible { display: block; }

.player-card {
  background: var(--panel); border: 2px solid var(--cyan);
  box-shadow: 0 0 20px rgba(0,245,255,0.15);
  padding: 20px; margin-bottom: 16px; position: relative; overflow: hidden;
}
.player-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  animation: scan 3s linear infinite;
}
@keyframes scan { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }

.player-name { font-family: var(--font-pixel); font-size: clamp(8px,2.5vw,12px); color: var(--yellow); text-shadow: 0 0 10px rgba(255,230,0,0.5); margin-bottom: 16px; }

.level-row { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
.level-badge { font-family: var(--font-pixel); font-size: clamp(28px,8vw,48px); color: var(--cyan); text-shadow: 0 0 30px var(--cyan); line-height: 1; flex-shrink: 0; }
.level-badge span { font-size: 0.4em; color: var(--muted); display: block; margin-bottom: 4px; }
.level-info { flex: 1; }
.xp-label { font-size: 10px; color: var(--muted); margin-bottom: 6px; }
.xp-bar-track { height: 12px; background: var(--bg); border: 2px solid var(--border); overflow: hidden; }
.xp-bar-fill {
  height: 100%; background: linear-gradient(90deg, var(--cyan), var(--purple));
  transition: width 0.8s cubic-bezier(0.34,1.56,0.64,1);
}
.xp-text { font-size: 10px; color: var(--cyan); margin-top: 4px; text-align: right; }

.rank-badge { font-family: var(--font-pixel); font-size: clamp(10px,3vw,14px); margin-bottom: 10px; }

.motivation-box { padding: 10px 12px; margin-top: 10px; border-left: 3px solid var(--green); background: rgba(0,255,136,0.05); }
.motivation-main { font-size: 12px; color: var(--green); margin-bottom: 6px; line-height: 1.5; }
.motivation-tip { font-size: 11px; color: var(--muted); line-height: 1.5; }

.final-display {
  text-align: center; padding: 20px; background: var(--panel);
  border: 2px solid var(--yellow); box-shadow: 0 0 30px rgba(255,230,0,0.15); margin-bottom: 16px;
}
.final-label { font-family: var(--font-pixel); font-size: 8px; color: var(--muted); margin-bottom: 8px; }
.final-val { font-family: var(--font-pixel); font-size: clamp(32px,10vw,56px); line-height: 1; }

.stats-section-title {
  font-family: var(--font-pixel); font-size: 8px; color: var(--purple);
  letter-spacing: 1px; margin: 20px 0 10px;
  display: flex; justify-content: space-between; align-items: center;
}
.stats-section-nota { color: var(--cyan); }

.stat-block { background: var(--panel); border: 2px solid var(--border); padding: 12px 14px; margin-bottom: 8px; }
.stat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.stat-name { font-size: 11px; color: var(--muted); }
.stat-val { font-family: var(--font-pixel); font-size: 10px; }
.stat-bar-track { height: 6px; background: var(--bg); border: 1px solid var(--border); overflow: hidden; }
.stat-bar-fill { height: 100%; transition: width 0.6s ease; }

.achievements-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 8px; }
.achievement {
  background: var(--panel); border: 2px solid var(--border);
  padding: 10px 8px; text-align: center;
}
.achievement.unlocked { border-color: var(--yellow); box-shadow: 0 0 12px rgba(255,230,0,0.2); }
.achievement.locked { opacity: 0.3; }
.ach-icon { font-size: 18px; margin-bottom: 5px; display: block; font-family: var(--font-pixel); color: var(--yellow); }
.ach-name { font-family: var(--font-pixel); font-size: 5px; color: var(--yellow); margin-bottom: 4px; line-height: 1.5; }
.ach-desc { font-size: 9px; color: var(--muted); line-height: 1.4; }
.ach-group { font-family: var(--font-pixel); font-size: 7px; color: var(--purple); margin: 16px 0 8px; letter-spacing: 1px; }
</style>
</head>
<body>

<div class="arcade-header">
  <div class="arcade-title">OFICINA TÉCNICA I</div>
  <div class="arcade-sub">▶ SELECCIONÁ TU PERSONAJE ◀</div>
</div>

<div class="selector-panel">
  <div class="selector-label">// GRUPO</div>
  <div class="group-tabs">
    <button class="group-tab active" onclick="selectGroup('LM')">L · M</button>
    <button class="group-tab" onclick="selectGroup('MJ')">M · J</button>
  </div>
  <div class="selector-label">// JUGADOR</div>
  <div class="player-list" id="player-list">
    <div class="state-msg"><div class="spinner"></div>Cargando...</div>
  </div>
</div>

<div class="game-screen" id="game-screen">

  <div class="player-card">
    <div class="player-name" id="g-name">—</div>
    <div class="rank-badge" id="g-rank">—</div>
    <div class="level-row">
      <div class="level-badge"><span>NIVEL</span><span id="g-level">—</span></div>
      <div class="level-info">
        <div class="xp-label">XP HACIA NIVEL <span id="g-next">—</span></div>
        <div class="xp-bar-track"><div class="xp-bar-fill" id="g-xpbar" style="width:0%"></div></div>
        <div class="xp-text"><span id="g-xp-cur">—</span> / <span id="g-xp-max">—</span> XP</div>
      </div>
    </div>
    <div class="motivation-box">
      <div class="motivation-main" id="g-motivation-main">—</div>
      <div class="motivation-tip" id="g-motivation-tip">—</div>
    </div>
  </div>

  <div class="final-display">
    <div class="final-label">// PUNTUACIÓN FINAL</div>
    <div class="final-val" id="g-final">—</div>
  </div>

  <div class="stats-section-title">
    <span>▸ COMPROMISO</span>
    <span class="stats-section-nota" id="g-n1">—</span>
  </div>
  <div class="stat-block">
    <div class="stat-header">
      <span class="stat-name">Asistencia <span style="color:var(--muted);font-size:9px">20%</span></span>
      <span class="stat-val" id="g-asist">—</span>
    </div>
    <div class="stat-bar-track"><div class="stat-bar-fill" id="bar-asist" style="width:0%"></div></div>
  </div>
  <div class="stat-block">
    <div class="stat-header">
      <span class="stat-name">EPP <span style="color:var(--muted);font-size:9px">20%</span></span>
      <span class="stat-val" id="g-epp">—</span>
    </div>
    <div class="stat-bar-track"><div class="stat-bar-fill" id="bar-epp" style="width:0%"></div></div>
  </div>
  <div class="stat-block">
    <div class="stat-header">
      <span class="stat-name">Participación <span style="color:var(--muted);font-size:9px">60%</span></span>
      <span class="stat-val" id="g-partic">—</span>
    </div>
    <div class="stat-bar-track"><div class="stat-bar-fill" id="bar-partic" style="width:0%"></div></div>
  </div>

  <div class="stats-section-title">
    <span>▸ TEORÍA</span>
    <span class="stats-section-nota" id="g-n2">—</span>
  </div>
  <div class="stat-block">
    <div class="stat-header">
      <span class="stat-name">Entregas TT <span style="color:var(--muted);font-size:9px">30%</span></span>
      <span class="stat-val" id="g-tt">—</span>
    </div>
    <div class="stat-bar-track"><div class="stat-bar-fill" id="bar-tt" style="width:0%"></div></div>
  </div>
  <div class="stat-block">
    <div class="stat-header">
      <span class="stat-name">Examen <span style="color:var(--muted);font-size:9px">70%</span></span>
      <span class="stat-val" id="g-exam">—</span>
    </div>
    <div class="stat-bar-track"><div class="stat-bar-fill" id="bar-exam" style="width:0%"></div></div>
  </div>

  <div class="stats-section-title">
    <span>▸ PRÁCTICA</span>
    <span class="stats-section-nota" id="g-n3">—</span>
  </div>
  <div id="tp-stat-blocks"></div>

  <div class="stats-section-title">▸ LOGROS</div>
  <div id="achievements"></div>

</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwNyF__3pe3B04CQVqgT__Bsly2KvkDjuHE-nG3PANiuw5ddrAqwH4cMQN_9MyVcqk/exec';
const el = id => document.getElementById(id);
const fmt = n => Math.abs(n-10)<1e-6 ? '10' : Number(n).toFixed(1);

function gradeColor(n) {
  if (n >= 8) return 'var(--green)';
  if (n >= 6) return 'var(--cyan)';
  if (n >= 4) return 'var(--yellow)';
  return 'var(--red)';
}

function tpTextToNum(txt, n1) {
  if (txt==='E')  return 10;
  if (txt==='MB') return 9;
  if (txt==='B')  return n1>=8?8:7;
  if (txt==='R')  return n1>=6?6:5;
  if (txt==='I')  return n1<2?1:n1<3?2:n1<4?3:4;
  return 0;
}

function ttTextToNum(txt, n1) {
  if (txt==='T')  return 10;
  if (txt==='T1') return n1>=9?9:8;
  if (txt==='T2') return n1>=7?7:6;
  if (txt==='T3') return n1>=5?5:4;
  if (txt==='T4') return n1<2?1:n1<3?2:3;
  return 0;
}

// ── RANGOS ──
const RANKS = [
  [9.5, 'Clase S',  'var(--cyan)'],
  [9.0, 'Clase A+', 'var(--green)'],
  [8.5, 'Clase A',  'var(--green)'],
  [8.0, 'Clase A−', 'var(--green)'],
  [7.5, 'Clase B+', 'var(--cyan)'],
  [7.0, 'Clase B',  'var(--cyan)'],
  [6.5, 'Clase B−', 'var(--cyan)'],
  [6.0, 'Clase C+', 'var(--yellow)'],
  [5.5, 'Clase C',  'var(--yellow)'],
  [5.0, 'Clase C−', 'var(--yellow)'],
  [4.5, 'Clase D+', 'var(--orange)'],
  [4.0, 'Clase D',  'var(--orange)'],
  [0,   'Clase F',  'var(--red)'],
];
function getRank(nf) {
  for (const [min, label, color] of RANKS) if (nf >= min) return {label, color};
  return {label: 'Clase F', color: 'var(--red)'};
}

// ── XP ──
function nfToXP(nf) { return Math.round(nf * 100); }
function xpLevel(xp) {
  const level = Math.min(Math.floor(xp / 100), 10);
  const cur = xp % 100;
  return { level, cur, pct: level >= 10 ? 100 : cur };
}

// ── FRASES ──
const MOTIVATIONS = {
  high: [
    "Logro desbloqueado. Seguís escribiendo tu mejor partida.",
    "Nivel de compromiso: legendario. El taller te reconoce.",
    "Sos el tipo de jugador que otros quieren tener en el equipo."
  ],
  mid: [
    "Estás en racha. Un componente más y desbloqueás el siguiente nivel.",
    "Ya demostraste que podés. Ahora es solo cuestión de mantenerlo.",
    "La constancia es el truco que nadie te cuenta. Seguí."
  ],
  low: [
    "Toda partida épica arranca desde cero. La tuya todavía está escribiéndose.",
    "Cada clase que venís suma puntos reales. No subestimes lo que acumula con el tiempo.",
    "Los mejores no nacieron siendo buenos — practicaron. Vos también podés."
  ],
  nodata: ["Tu partida todavía no empezó. Vení a clase y empezá a sumar puntos."]
};

const TIPS = {
  asist:  "Falta presencia — sin venir no se puede mejorar.",
  epp:    "Traé el equipo completo la próxima clase. Es el punto más fácil de recuperar.",
  partic: "Involucrarte en clase es lo que más pesa en Compromiso. Animate a participar más.",
  tt:     "Todavía podés entregar trabajos teóricos. Cada entrega mueve la aguja.",
  exam:   "El examen define el 70% de Teoría. Vale la pena dedicarle tiempo.",
  tp:     "Los trabajos prácticos son tu mayor palanca. Cada uno que entregás suma directo."
};

function getMotivation(nf) {
  if (nf === 0) return MOTIVATIONS.nodata[0];
  const pool = nf >= 7.5 ? MOTIVATIONS.high : nf >= 5 ? MOTIVATIONS.mid : MOTIVATIONS.low;
  return pool[Math.floor(Math.random() * pool.length)];
}

function getWeakTip(s, n1, ttProm, tpProm, examen) {
  const scores = {
    asist:  Number(s.asist) || 0,
    epp:    (Number(s.epp) || 0) * 10,
    partic: Number(s.partic) || 0,
    tt:     ttProm,
    exam:   examen,
    tp:     tpProm
  };
  const weakest = Object.entries(scores).sort((a,b) => a[1]-b[1])[0][0];
  return TIPS[weakest];
}

// ── LOGROS ──
const ACHIEVEMENT_GROUPS = [
  {
    label: 'ASISTENCIA',
    items: [
      { name:'PRESENTE',       desc:'Asistencia mayor a 5',    icon:'★', check: s => (Number(s.asist)||0) > 5 },
      { name:'PUNTUAL',        desc:'Asistencia mayor a 7',    icon:'★★', check: s => (Number(s.asist)||0) > 7 },
      { name:'PRESENCIA TOTAL',desc:'Asistencia perfecta',     icon:'★★★', check: s => (Number(s.asist)||0) >= 10 },
    ]
  },
  {
    label: 'EPP',
    items: [
      { name:'EQUIPADO',   desc:'EPP mayor a 50%', icon:'◆', check: s => (Number(s.epp)||0) > 0.5 },
      { name:'PROTEGIDO',  desc:'EPP mayor a 80%', icon:'◆◆', check: s => (Number(s.epp)||0) > 0.8 },
      { name:'BLINDADO',   desc:'EPP al 100%',     icon:'◆◆◆', check: s => (Number(s.epp)||0) >= 1 },
    ]
  },
  {
    label: 'PARTICIPACIÓN',
    items: [
      { name:'ACTIVO',        desc:'Participación mayor a 5', icon:'▲', check: s => (Number(s.partic)||0) > 5 },
      { name:'EN RACHA',      desc:'Participación mayor a 7', icon:'▲▲', check: s => (Number(s.partic)||0) > 7 },
      { name:'RACHA PERFECTA',desc:'Participación mayor a 9', icon:'▲▲▲', check: s => (Number(s.partic)||0) > 9 },
    ]
  },
  {
    label: 'TRABAJOS TEÓRICOS',
    items: [
      { name:'ENTREGANDO', desc:'Al menos 1 TT entregado', icon:'●', check: s => [s.tt1,s.tt2,s.tt3,s.tt4].some(Boolean) },
      { name:'CONSTANTE',  desc:'Al menos 3 TTs entregados', icon:'●●', check: s => [s.tt1,s.tt2,s.tt3,s.tt4].filter(Boolean).length >= 3 },
      { name:'ENTREGADOR', desc:'Los 4 TTs entregados', icon:'●●●', check: s => [s.tt1,s.tt2,s.tt3,s.tt4].every(Boolean) },
    ]
  },
  {
    label: 'EXAMEN',
    items: [
      { name:'EXAMINADO',      desc:'Examen rendido',        icon:'◉', check: s => (Number(s.examen)||0) > 0 },
      { name:'APROBADO',       desc:'Examen mayor a 6',      icon:'◉◉', check: s => (Number(s.examen)||0) > 6 },
      { name:'TEÓRICO PURO',   desc:'Examen mayor a 8',      icon:'◉◉◉', check: s => (Number(s.examen)||0) > 8 },
    ]
  },
  {
    label: 'TRABAJOS PRÁCTICOS',
    items: [
      { name:'ARRANCANDO',   desc:'Al menos 2 TPs entregados', icon:'✦', check: s => [s.tp1,s.tp2,s.tp3,s.tp4,s.tp5,s.tp6].filter(Boolean).length >= 2 },
      { name:'MANOS A LA OBRA', desc:'Al menos 4 TPs entregados', icon:'✦✦', check: s => [s.tp1,s.tp2,s.tp3,s.tp4,s.tp5,s.tp6].filter(Boolean).length >= 4 },
      { name:'ARTESANO',     desc:'Los 6 TPs entregados',      icon:'✦✦✦', check: s => [s.tp1,s.tp2,s.tp3,s.tp4,s.tp5,s.tp6].every(Boolean) },
    ]
  },
];

// ── DATA ──
let allData = { LM: [], MJ: [] };
let currentGroup = 'LM';

async function loadGroup(suffix) {
  if (allData[suffix].length) return;
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?sheet=${suffix}`);
    allData[suffix] = await res.json();
  } catch(e) {
    el('player-list').innerHTML = '<div class="state-msg">Error al cargar.</div>';
  }
}

async function selectGroup(suffix) {
  currentGroup = suffix;
  document.querySelectorAll('.group-tab').forEach(t =>
    t.classList.toggle('active', (suffix==='LM') === t.textContent.includes('L'))
  );
  el('player-list').innerHTML = '<div class="state-msg"><div class="spinner"></div>Cargando...</div>';
  await loadGroup(suffix);
  renderList();
}

function renderList() {
  const list = el('player-list');
  const students = allData[currentGroup];
  if (!students.length) { list.innerHTML = '<div class="state-msg">Sin datos.</div>'; return; }
  list.innerHTML = '';
  students.forEach((s, i) => {
    const nf = Number(s.nf) || 0;
    const { label, color } = getRank(nf);
    const btn = document.createElement('button');
    btn.className = 'player-btn';
    btn.dataset.idx = i;
    btn.innerHTML = `<span>${s.nombre.split(',')[0]}</span><span class="player-lvl" style="color:${color}">${label}</span>`;
    btn.onclick = () => showPlayer(i);
    list.appendChild(btn);
  });
}

function showPlayer(idx) {
  document.querySelectorAll('.player-btn').forEach((b,i) => b.classList.toggle('active', i===idx));
  const s = allData[currentGroup][idx];
  const nf     = Number(s.nf)     || 0;
  const n1     = Number(s.n1)     || 0;
  const n2     = Number(s.n2)     || 0;
  const n3     = Number(s.n3)     || 0;
  const asist  = Number(s.asist)  || 0;
  const eppPct = Number(s.epp)    || 0;
  const partic = Number(s.partic) || 0;
  const examen = Number(s.examen) || 0;

  // TTs
  const ttTexts = [s.tt1,s.tt2,s.tt3,s.tt4];
  const ttNums  = ttTexts.map(t => t ? ttTextToNum(String(t), n1) : 0);
  const ttProm  = ttNums.reduce((a,b)=>a+b,0) / 4;

  // TPs
  const tpKeys   = ['tp1','tp2','tp3','tp4','tp5','tp6'];
  const tpNums   = tpKeys.map(k => s[k] ? tpTextToNum(String(s[k]), n1) : 0);
  const tpProm   = tpNums.reduce((a,b)=>a+b,0) / 6;

  // Rank & level
  const { label: rankLabel, color: rankColor } = getRank(nf);
  const xp = nfToXP(nf);
  const { level, cur, pct } = xpLevel(xp);

  // Player card
  el('g-name').textContent = s.nombre;
  el('g-rank').textContent = rankLabel;
  el('g-rank').style.color = rankColor;
  el('g-level').textContent = level;
  el('g-next').textContent = level < 10 ? level + 1 : 'MAX';
  el('g-xpbar').style.width = `${pct}%`;
  el('g-xp-cur').textContent = cur;
  el('g-xp-max').textContent = 100;
  el('g-motivation-main').textContent = getMotivation(nf);
  el('g-motivation-tip').textContent = '▸ ' + getWeakTip(s, n1, ttProm, tpProm, examen);

  // Final
  el('g-final').textContent = fmt(nf);
  el('g-final').style.color = gradeColor(nf);

  // N1
  el('g-n1').textContent = fmt(n1);
  el('g-n1').style.color = gradeColor(n1);
  el('g-asist').textContent = fmt(asist);
  el('g-asist').style.color = gradeColor(asist);
  el('bar-asist').style.width = `${asist*10}%`;
  el('bar-asist').style.background = gradeColor(asist);
  el('g-epp').textContent = `${Math.round(eppPct*100)}%`;
  el('g-epp').style.color = gradeColor(eppPct*10);
  el('bar-epp').style.width = `${eppPct*100}%`;
  el('bar-epp').style.background = gradeColor(eppPct*10);
  el('g-partic').textContent = fmt(partic);
  el('g-partic').style.color = gradeColor(partic);
  el('bar-partic').style.width = `${partic*10}%`;
  el('bar-partic').style.background = gradeColor(partic);

  // N2
  el('g-n2').textContent = fmt(n2);
  el('g-n2').style.color = gradeColor(n2);
  el('g-tt').textContent = fmt(ttProm);
  el('g-tt').style.color = gradeColor(ttProm);
  el('bar-tt').style.width = `${ttProm*10}%`;
  el('bar-tt').style.background = gradeColor(ttProm);
  el('g-exam').textContent = fmt(examen);
  el('g-exam').style.color = gradeColor(examen);
  el('bar-exam').style.width = `${examen*10}%`;
  el('bar-exam').style.background = gradeColor(examen);

  // N3
  el('g-n3').textContent = fmt(n3);
  el('g-n3').style.color = gradeColor(n3);
  const tpContainer = el('tp-stat-blocks');
  tpContainer.innerHTML = '';
  tpKeys.forEach((k, i) => {
    const txt = s[k];
    const val = tpNums[i];
    const div = document.createElement('div');
    div.className = 'stat-block';
    div.innerHTML = `
      <div class="stat-header">
        <span class="stat-name">TP ${i+1} <span style="color:var(--muted);font-size:9px">16.7%</span></span>
        <span class="stat-val" style="color:${txt?gradeColor(val):'var(--muted)'}">${txt?`${txt} · ${fmt(val)}`:'—'}</span>
      </div>
      <div class="stat-bar-track"><div class="stat-bar-fill" style="background:${gradeColor(val)};width:${val*10}%"></div></div>`;
    tpContainer.appendChild(div);
  });

  // Logros
  const achContainer = el('achievements');
  achContainer.innerHTML = '';
  ACHIEVEMENT_GROUPS.forEach(group => {
    const groupLabel = document.createElement('div');
    groupLabel.className = 'ach-group';
    groupLabel.textContent = '▸ ' + group.label;
    achContainer.appendChild(groupLabel);
    const grid = document.createElement('div');
    grid.className = 'achievements-grid';
    group.items.forEach(a => {
      const unlocked = a.check(s);
      const div = document.createElement('div');
      div.className = `achievement ${unlocked ? 'unlocked' : 'locked'}`;
      div.innerHTML = `<span class="ach-icon">${a.icon}</span><div class="ach-name">${a.name}</div><div class="ach-desc">${a.desc}</div>`;
      grid.appendChild(div);
    });
    achContainer.appendChild(grid);
  });

  el('game-screen').classList.add('visible');
  el('game-screen').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

loadGroup('LM').then(renderList);
loadGroup('MJ');
</script>
</body>
</html>
